# Fly.io: one small machine, a 1GB disk for the SQLite file, always on so syncing and Live keep going.
app = "crate"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/app/data/crate.db"
  CRATE_SYNC_LOOP = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "crate_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
